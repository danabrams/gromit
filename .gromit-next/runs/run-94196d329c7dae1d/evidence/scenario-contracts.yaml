scenarios:
    - name: worktree-is-healthy-validation-proceeds-normally
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: func (s *ValidateStage) checkWorktreeHealth(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: checkWorktreeHealth(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: .git
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: go.mod
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: scenario-contracts.yaml
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RunFinal(
    - name: worktree-git-file-missing-recovery-succeeds
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: func (s *ValidateStage) recoverWorktree(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RemoveWorktree(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RecoverWorktree(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: rs.WorktreePath
        - file_contains:
            path: internal/next/specloop/stages/init.go
            pattern: RecoverWorktree(repoDir, branch string) (worktreePath string, err error)
        - file_contains:
            path: internal/next/runstore/events.go
            pattern: WorktreeRecoveryEvent
        - file_contains:
            path: internal/next/runstore/events.go
            pattern: RecoverySucceeded
        - file_contains:
            path: internal/next/runstore/events.go
            pattern: HealthCheckFailure
        - file_contains:
            path: internal/next/runstore/events.go
            pattern: NewWorktreePath
        - file_contains:
            path: internal/next/runstore/events.go
            pattern: worktree_recovery
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: gromit/spec-
    - name: worktree-directory-missing-entirely-recovery-succeeds
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: directory does not exist
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RemoveWorktree(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RecoverWorktree(
    - name: worktree-go-mod-missing-recovery-succeeds
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: go.mod
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: recoverWorktree(
    - name: recovery-fails-run-blocks-with-infrastructure-diagnostic
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: 'infrastructure: '
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: Blocked
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: rs.BlockerSummary
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RecoverySucceeded
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: worktree recovery failed
    - name: health-check-passes-on-second-cycle-after-prior-success
      assertions:
        - file_not_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: alreadyChecked
        - file_not_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: healthChecked
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: checkWorktreeHealth(
    - name: remove-worktree-fails-during-recovery
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: worktree cleanup failed
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: Blocked
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: WorktreeRecoveryEvent
    - name: worktree-breaks-between-cycles-recovery-on-cycle-2
      assertions:
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: GitOps
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: RepoDir
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: checkWorktreeHealth(
        - file_contains:
            path: internal/next/specloop/stages/validate.go
            pattern: WorktreeRecoveryEvent
