# Ralph Runner Configuration
# See: https://github.com/danabrams/ralph-runner

# Model selection based on bead priority
models:
  # Priority-based defaults (P0=critical, P1=normal, P2=low)
  p0: opus
  p1: sonnet
  p2: haiku

  # Validation always uses haiku for cost efficiency
  validation: haiku

  # Label overrides (take precedence over priority)
  labels:
    "complexity:high": opus
    "complexity:low": haiku

# Escalation chain on failure (left to right)
escalation:
  enabled: true
  chain: [haiku, sonnet, opus]
  max_retries_per_model: 1

# Loop settings
loop:
  max_iterations: 0  # 0 = unlimited
  stop_on_failure: false  # Continue to next bead on failure

# Validation settings - customize for your project
validation:
  enabled: true
  commands:
    - "mise exec -- go test ./..."
    - "mise exec -- go build ./cmd/ralph"

# Pre-flight checks - verify required tools before validation
preflight:
  # auto_install: ask (default) - ask user if tools are missing
  #               always - automatically install missing tools
  #               never - fail with error message
  auto_install: ask
  # Optional: explicitly specify required tools (auto-detected from validation.commands if not set)
  # tools:
  #   - go
  #   - mise

# Claude CLI settings
claude:
  binary: "claude"
  timeout: 600  # seconds per invocation
  flags:
    - "--dangerously-skip-permissions"

# Paths (relative to project root)
paths:
  templates: ".ralph/templates"
  specs: ".ralph/specs"
  logs: ".ralph/logs"
  project_claude_md: "CLAUDE.md"  # Your project's CLAUDE.md
