# Example gromit.yaml for E2E tests
# This file is not used directly - tests copy the scaffolded directory from gromit init

models:
  p0: opus
  p1: sonnet
  p2: haiku
  validation: haiku

escalation:
  enabled: true
  chain:
    - haiku
    - sonnet
    - opus
  max_retries_per_model: 1
  max_retries_per_bead: 10

loop:
  max_iterations: 0
  time_budget_minutes: 0
  stuck_bead_threshold: 3
  stop_on_failure: false

validation:
  enabled: true
  commands:
    - "go test ./..."
    - "go vet ./..."
    - "go build ./cmd/gromit"

paths:
  templates: ".gromit/templates"
  specs: ".gromit/specs"
  logs: ".gromit/logs"
  project_claude_md: "CLAUDE.md"
