# Example gromit.yaml for E2E tests
# This file is not used directly - tests copy the scaffolded directory from gromit init

models:
  p0: haiku
  p1: haiku
  p2: haiku
  validation: haiku

escalation:
  enabled: true
  chain:
    - haiku
    - sonnet
  max_retries_per_model: 1

loop:
  max_iterations: 0
  time_budget_minutes: 0
  stuck_bead_threshold: 3
  stop_on_failure: false

validation:
  enabled: true
  non_interactive: true
  fast_commands:
    - "go test ./..."
  full_commands:
    - "go test ./..."
  full_validation_every_n_successes: 0
  max_validation_retries: 1
  commands:
    - "go test ./..."

paths:
  templates: ".gromit/templates"
  specs: ".gromit/specs"
  logs: ".gromit/logs"
  project_claude_md: "CLAUDE.md"
