# Gromit Configuration
# See: https://github.com/danabrams/gromit

# Model selection based on bead priority
models:
  # Priority-based defaults (P0=critical, P1=normal, P2=low)
  p0: opus
  p1: sonnet
  p2: haiku

  # Validation always uses haiku for cost efficiency
  validation: haiku

  # Label overrides (take precedence over priority)
  labels:
    "complexity:high": opus
    "complexity:low": haiku

# Multi-provider configuration
providers:
  claude:
    binary: claude
    flags: ["--dangerously-skip-permissions"]
    prompt_delivery: stdin
    models:
      high: opus
      medium: sonnet
      low: haiku
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
  openai:
    binary: codex
    flags: ["--dangerously-bypass-approvals-and-sandbox"]
    prompt_delivery: prompt_file_arg
    prompt_flag: "--prompt"
    models:
      high: gpt-5.3-codex
      medium: gpt-5.3-codex
      low: gpt-5-mini
    reasoning_effort:
      high: high
      medium: medium
    cost_per_1k_input: 0.00175    # medium-tier baseline
    cost_per_1k_output: 0.014
    model_costs:
      gpt-5.3-codex:                # high tier
        cost_per_1k_input: 0.00175
        cost_per_1k_output: 0.014
      gpt-5-mini:                    # low tier
        cost_per_1k_input: 0.00025
        cost_per_1k_output: 0.002

# Routing - multi-provider routing configuration
routing:
  phase_preferences:
    build: any
    validate: any
    review: openai       # force review to Codex/OpenAI provider
    analyze: any
    scope_check: any
    precheck: any
    decompose: openai    # force decompose to Codex/OpenAI provider
    retro: openai        # force retro to Codex/OpenAI provider
  ratio:
    claude: 0
    openai: 100
  fallback:
    enabled: true
    cooldown: 30m
  # circuit_breaker:
  #   enabled: false
  #   window_size: 10
  #   failure_threshold: 0.3
  #   degraded_floor: 20
  #   recovery_successes: 5

# Stream output behavior
stream:
  preserve_provider_output: true  # keep provider-native terminal colors/layout

# Example: Codex provider configuration
# codex:
#     binary: codex
#     flags: []
#     prompt_delivery: stdin
#     models:
#       high: gpt-5.3-codex
#       medium: gpt-5.3-codex
#       low: gpt-5.3-codex

# Escalation chain on failure (left to right)
escalation:
  enabled: true
  chain: [haiku, sonnet, opus]
  max_retries_per_model: 1
  max_retries_per_bead: 3  # cap repeated retries on flaky beads to reduce iteration churn

# Andon autonomy controls
andon:
  assumption_budget: 2  # allow up to 2 reasonable assumptions before escalation
  l1_retry_cap: 2  # L1 quick-fix retry budget before escalating to L2
  l1_time_cap_minutes: 2  # L1 quick-fix time cap
  l2_time_cap_minutes: 15  # L2 focused recovery hard cap from spec
  hard_stops:
    block_bulk_delete: true  # require explicit approval for bulk deletion operations
    block_irreversible_migrations: true  # require explicit approval for irreversible migrations
    block_credential_changes: true  # require explicit approval for secrets/credential changes
    bulk_delete_allowlist:  # allowlist conventions: keep narrow, path-scoped globs only
      - ".gromit/logs/**"
      - ".gromit/tmp/**"

# Loop settings
loop:
  max_iterations: 0  # 0 = unlimited
  stop_on_failure: false  # Continue to next bead on failure
  stuck_bead_threshold: 3  # Skip bead if it fails this many times across runs
  max_consecutive_skips: 5  # Stop loop after 5 consecutive precheck skips — needs headroom for related beads with overlapping acceptance criteria
  max_cross_run_failures: 5  # Skip bead if it has 5+ consecutive failures across runs
  learn_from_success: true  # Extract learnings from successful iterations (default: true)
  between_iterations_command: ""  # Disabled: avoid rebuilding between iterations
  end_of_loop_command: ""  # Disabled: no command run when the loop exits

# Scope checking - estimate task complexity before work
scope_check:
  enabled: true
  model: haiku  # haiku is fast and cheap for estimation
  block_oversized: true  # block over-scoped beads before spending compute

# Pre-check - verify if acceptance criteria are already met before starting work
precheck:
  enabled: false  # disabled to avoid auto-closing on acceptance-criteria precheck
  model: haiku  # fast check with haiku
  timeout_seconds: 120  # headroom for CLI startup + file reads + tool use
  verification:
    enabled: true  # run sonnet verification when haiku says PASSED
    timeout_seconds: 120

# Validation settings - customize for your project
validation:
  enabled: true
  non_interactive: true  # fail validation if commands attempt to prompt for input
  # phase_timeout_seconds: 900  # optional per-validation phase budget; defaults to claude.bead_timeout when omitted
  max_parallel_commands: 1  # run sequentially; parallel go test/vet/build oversubscribes CPU/cache and is slower in practice
  fast_commands:  # per-bead gate in the main loop (keeps iteration latency low)
    - "GROMIT_TEST_TOUCHED_SHORT=1 ./scripts/test_touched.sh"
    - "./scripts/vet_touched.sh"
  full_commands:  # heavier gate at controlled checkpoints
    - "go test -vet=off -p 4 -parallel 4 ./..."
    - "go vet ./..."
    - "go build ./..."
  full_validation_every_n_successes: 0  # 0 disables periodic full gate; final full gate still runs at session end
  commands:
    - "go test -vet=off -p 4 -parallel 4 ./..."
    - "go vet ./..."
    - "go build ./..."
  mandatory_commands:  # prefixes that must appear in the validation command set
    - "go test"
    - "go vet"
    - "go build"
  max_validation_retries: 1  # one recovery loop; unchanged failures stop immediately

# Pre-flight checks - verify required tools before validation
preflight:
  auto_install: ask  # ask | always | never
  compile_command: "go build ./..."

# Claude CLI settings
claude:
  binary: "claude"
  timeout: 900           # seconds per Claude invocation
  stall_timeout: 180     # seconds with no output before auto-retry (initial, pre-activity)
  stall_timeout_active: 600  # seconds with no output after tool activity (longer, allows thinking)
  bead_timeout: 2700     # seconds max per bead (all retries + analysis + validation)
  analysis_timeout: 180  # seconds max per failure analysis invocation
  pipeline_timeout: 1800 # seconds max per decompose/review pipeline phase (defaults to 1800)
  flags:
    - "--dangerously-skip-permissions"
  # Per-model timeout overrides (non-zero values override the defaults above)
  model_timeouts:
    sonnet:
      timeout: 1200            # longer invocation timeout — sonnet consistently needs >900s
      stall_timeout_active: 900  # longer active stall for sonnet's deeper thinking
      bead_timeout: 2400       # longer bead budget — sonnet retries need extra headroom
    opus:
      timeout: 1800              # retro analysis needs longer than the 900s default
      stall_timeout_active: 420  # longer than code default (300s) — opus legitimately takes longer on complex reasoning
    haiku:
      stall_timeout: 90        # shorter stall — haiku should respond quickly
      bead_timeout: 900        # shorter bead budget — fail fast on haiku
    # gpt-5.3-codex timeout reverted: 10min experiment falsified (18/18 >10min succeeded)
    # gpt-5.3-codex-spark timeout reverted: matched high-tier codex revert

# Agent selection for interactive sessions
# Note: `gromit review --non-interactive` uses `providers` + `routing.phase_preferences.review`,
# not `agents.phases.review`.
agents:
  prompt: false
  phases:
    refine: codex
    plan: codex
    review: codex
    explore: codex
    debug: codex

# Git settings
git:
  auto_push: true  # Push to remote after each successful bead (default: true)
  push_failure: "warn"  # What to do when push fails: "warn" | "stop" (default: "warn")
  push_timeout: 60  # Timeout for git push in seconds (default: 60); set to 0 to disable

# Worktree - enable concurrent interactive sessions via git worktrees
# worktree:
#   enabled: true  # Enable worktree isolation for interactive commands (default: true)
#   auto_merge: true  # Merge interactive branches between iterations (default: true)
#   merge_failure: "warn"  # What to do on merge conflict: "warn" | "stop" (default: "warn")

# State file staleness protection - detects and auto-heals corrupted state from crashes
state:
  # How old (in minutes) state.json can be before it's considered stale
  # State is loaded at run start; if updated_at exceeds this threshold, counters are reset
  # Default: 60 (1 hour). Set higher if your builds routinely take longer than 1 hour.
  # Note: The clean_exit flag (set false at start, true at shutdown) is the primary
  # crash detector and always triggers auto-heal regardless of time elapsed.
  stale_threshold: 60

# Methodology - test-driven development approaches
methodology:
  atdd: false
  tdd: true
  # max_tdd_cycles: 10  # Maximum red/green/refactor loops per bead before stopping (default: 10)
  # spec_gate_max_retries: 3  # Max scoped spec-gate fix synthesis retries before stopping (default: 3)
  # atdd_prompt:
  #   include_rules: true  # Include RULES.md in ATDD build prompts
  #   include_spec: true  # Include spec text in ATDD build prompts
  #   include_claude_md: true  # Include CLAUDE.md in ATDD build prompts
  #   max_chars: 20000  # Character budget for ATDD prompts (0 = unlimited)
  #   max_confirmed_learning_chars: 2000  # Max chars from confirmed learnings in ATDD prompts
  fresh_context_per_cycle: false  # Use a fresh invocation context for each TDD cycle instead of single-invocation flow
  # granularity: "bead"  # "bead" or "spec" (default: "bead")
  # Optional phase-specific time budgets (seconds). Any zero/omitted value falls back to claude.bead_timeout.
  # phase_timeouts:
  #   red_seconds: 900
  #   green_seconds: 900
  #   refactor_seconds: 900

# Learnings - control how confirmed learnings are injected into build prompts
learnings:
  skip_build_learnings: true  # Experiment: prune learnings from build prompts
#   max_learning_chars: 8000  # Character budget for confirmed learnings (0 = unlimited)

# Prompt context shaping budgets (optional)
# prompt:
#   budget:
#     max_chars: 20000          # Total prompt context budget in characters
#     learning_cap_chars: 2000  # Max chars from confirmed learnings after trimming

# Paths (relative to project root)
paths:
  templates: ".gromit/templates"
  specs: ".gromit/specs"
  logs: ".gromit/logs"
  project_claude_md: "CLAUDE.md"  # Your project's CLAUDE.md

# Session - per-session overrides for loop behavior and tooling
# session:
#   iterations: 0              # Max iterations this session (0 = use loop.max_iterations)
#   test_command: ""           # Override validation test command for this session
#   max_fix_retries: 3         # Max auto-fix retries before escalating to Claude
#   fix_tier: "medium"         # Model tier to use for auto-fix (low, medium, high)
#   review: true               # Run code review after each bead
#   retro: true                # Run retrospective at session end

# Runbook - configures retention of runbook entries
# runbook:
#   ttl_days: 14               # Days before runbook entries expire (default: 14)

# Spec Gate - validates spec quality before allowing work to proceed
# spec_gate:
#   enabled: true              # Enable spec gate validation (default: true)
#   max_cycles: 3              # Max validation cycles before giving up (default: 3)
#   model: sonnet              # Model to use for spec validation (default: sonnet)
#   auto_trigger: true         # Trigger spec gate automatically before work (default: true)
