# Gromit Configuration
# See: https://github.com/danabrams/gromit

# Model selection based on bead priority
models:
  # Priority-based defaults (P0=critical, P1=normal, P2=low)
  p0: opus
  p1: sonnet
  p2: haiku

  # Validation always uses haiku for cost efficiency
  validation: haiku

  # Label overrides (take precedence over priority)
  labels:
    "complexity:high": opus
    "complexity:low": haiku

# Multi-provider configuration
providers:
  claude:
    binary: claude
    flags: ["--dangerously-skip-permissions"]
    prompt_delivery: stdin
    models:
      high: opus
      medium: sonnet
      low: haiku
  openai:
    binary: codex
    flags: []
    prompt_delivery: prompt_file_arg
    prompt_flag: "--prompt"
    models:
      high: gpt-5.3-codex
      medium: gpt-5.2-codex
      low: gpt-5.3-codex-spark

# Routing - multi-provider routing configuration
routing:
  phase_preferences:
    build: any
    validate: any
    review: cross        # use opposite provider from build
    analyze: any
    scope_check: any
    precheck: any
    decompose: any
  ratio:
    openai: 0
    claude: 100
  fallback:
    enabled: true
    cooldown: 30m

# Example: Codex provider configuration
# codex:
#     binary: codex
#     flags: []
#     prompt_delivery: stdin
#     models:
#       high: gpt-5.3-codex
#       medium: gpt-5.3-codex
#       low: gpt-5.3-codex

# Escalation chain on failure (left to right)
escalation:
  enabled: true
  chain: [haiku, sonnet, opus]
  max_retries_per_model: 1

# Loop settings
loop:
  max_iterations: 0  # 0 = unlimited
  stop_on_failure: false  # Continue to next bead on failure
  stuck_bead_threshold: 3  # Skip bead if it fails this many times across runs
  max_consecutive_skips: 5  # Stop loop after 5 consecutive precheck skips — needs headroom for related beads with overlapping acceptance criteria
  learn_from_success: true  # Extract learnings from successful iterations (default: true)
  between_iterations_command: "make"  # Shell command to run after each successful bead (e.g., rebuild binary)

# Scope checking - estimate task complexity before work
scope_check:
  enabled: false
  model: haiku  # haiku is fast and cheap for estimation
  block_oversized: true  # block over-scoped beads before spending compute

# Pre-check - verify if acceptance criteria are already met before starting work
precheck:
  enabled: true  # defaults to true if omitted
  model: haiku  # fast check with haiku
  timeout_seconds: 120  # headroom for CLI startup + file reads + tool use

# Validation settings - customize for your project
validation:
  enabled: true
  commands:
    - "go test ./..."
    - "go vet ./..."
    - "go build ./..."

# Pre-flight checks - verify required tools before validation
preflight:
  auto_install: ask  # ask | always | never

# Claude CLI settings
claude:
  binary: "claude"
  timeout: 900           # seconds per Claude invocation
  stall_timeout: 180     # seconds with no output before auto-retry (initial, pre-activity)
  stall_timeout_active: 600  # seconds with no output after tool activity (longer, allows thinking)
  bead_timeout: 1800     # seconds max per bead (all retries + analysis + validation)
  analysis_timeout: 180  # seconds max per failure analysis invocation
  flags:
    - "--dangerously-skip-permissions"
  # Per-model timeout overrides (non-zero values override the defaults above)
  model_timeouts:
    sonnet:
      timeout: 1200            # longer invocation timeout — sonnet consistently needs >900s
      stall_timeout_active: 900  # longer active stall for sonnet's deeper thinking
      bead_timeout: 2400       # longer bead budget for sonnet retries
    opus:
      timeout: 1800              # retro analysis needs longer than the 900s default
      stall_timeout_active: 420  # longer than code default (300s) — opus legitimately takes longer on complex reasoning
    haiku:
      stall_timeout: 90        # shorter stall — haiku should respond quickly
      bead_timeout: 900        # shorter bead budget — fail fast on haiku

# Git settings
git:
  auto_push: true  # Push to remote after each successful bead (default: true)
  push_failure: "warn"  # What to do when push fails: "warn" | "stop" (default: "warn")

# Worktree - enable concurrent interactive sessions via git worktrees
# worktree:
#   enabled: true  # Enable worktree isolation for interactive commands (default: true)
#   auto_merge: true  # Merge interactive branches between iterations (default: true)
#   merge_failure: "warn"  # What to do on merge conflict: "warn" | "stop" (default: "warn")

# State file staleness protection - detects and auto-heals corrupted state from crashes
state:
  # How old (in minutes) state.json can be before it's considered stale
  # State is loaded at run start; if updated_at exceeds this threshold, counters are reset
  # Default: 60 (1 hour). Set higher if your builds routinely take longer than 1 hour.
  # Note: The clean_exit flag (set false at start, true at shutdown) is the primary
  # crash detector and always triggers auto-heal regardless of time elapsed.
  stale_threshold: 60

# Methodology - test-driven development approaches
methodology:
  atdd: true
  tdd: true

# Learnings - control how confirmed learnings are injected into build prompts
# learnings:
#   max_learning_chars: 8000  # Character budget for confirmed learnings (0 = unlimited)

# Paths (relative to project root)
paths:
  templates: ".gromit/templates"
  specs: ".gromit/specs"
  logs: ".gromit/logs"
  project_claude_md: "CLAUDE.md"  # Your project's CLAUDE.md
